# Conda environment for the training server (docs/training_plan_v5.tex, phase S). FreeCAD 1.0 from conda-forge provides
# `freecadcmd`; every training solid is built by it (project rule). Versions pinned to what the laptop runs.
#
#   conda env create -f server/environment.yml && conda activate shapereco
#   pip install stl-to-voxel==0.10.1 numpy-stl==3.2.0   # the project's voxelizer (`stltovoxel` on PATH), as on the laptop
#   pip install libigl==2.6.3                            # REQUIRED: the default field backend of new data (exact, 43x faster)
#   bash server/run_plan.sh check     # prints versions, finds freecadcmd / stltovoxel / the GPUs
name: shapereco
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - freecad=1.0
  - numpy=2.2
  - scipy=1.15
  - trimesh=4.11
  - rtree
  - pillow
  - pyyaml
  - pytest
  - pytorch=2.7
  - pytorch-cuda=12.4
  - pip
